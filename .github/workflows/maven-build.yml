name: Java CI with Maven

on:
  push:
    branches: ["develop"]
  pull_request:
    branches: ["develop"]

permissions:
  contents: read

jobs:
  # ── Job 1: Unit Tests — fast gate (~60s) ─────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up JDK 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          java-version: "25"
          distribution: "zulu"
          cache: "maven"

      - name: Run Unit Tests
        run: ./mvnw -B clean test -Dspotless.check.skip=true --file pom.xml

      - name: Upload Surefire Reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

      # Upload the .exec binary so the coverage gate can merge it with IT data
      - name: Upload Unit Test Coverage Data
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: jacoco-unit-exec
          path: target/jacoco.exec
          retention-days: 1

  # ── Job 2: Integration Tests — Testcontainers (~5 min) ───────────────────
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    env:
      TESTCONTAINERS_RYUK_DISABLED: "true"
      # Fineract itself is loaded from Maven runtime dependencies, matching the plugin build.
      FINERACT_IT_IMAGE: eclipse-temurin:25-jre

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up JDK 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          java-version: "25"
          distribution: "zulu"
          cache: "maven"

      - name: Check Docker Resources
        run: docker info | grep -E "Memory|CPUs"

      # Authenticate to Docker Hub to avoid anonymous pull rate limits.
      # Set DOCKERHUB_USERNAME and DOCKERHUB_PASSWORD as repository secrets.
      - name: DockerHub Login
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
        run: echo "$DOCKERHUB_PASSWORD" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

      # Pre-pull the Java runtime image — fail early if the image is unavailable
      - name: Pre-pull Fineract Image
        run: docker pull "$FINERACT_IT_IMAGE"

      # -Dsurefire.skip=true: compile + run only Failsafe, don't re-run unit tests
      - name: Run Integration Tests
        run: ./mvnw -B clean package verify -Dspotless.check.skip=true -Dsurefire.skip=true --file pom.xml

      - name: Stage Plugin JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deployment
          shopt -s nullglob
          jars=()
          for jar in target/*.jar; do
            case "$jar" in
              *-sources.jar|*-javadoc.jar|*-tests.jar) continue ;;
            esac
            jars+=("$jar")
          done
          if [ "${#jars[@]}" -ne 1 ]; then
            echo "Expected exactly one plugin JAR, found ${#jars[@]}." >&2
            exit 1
          fi
          cp "${jars[0]}" deployment/

      - name: Upload Plugin JAR
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: selfservice-plugin-jar
          path: deployment/*.jar
          if-no-files-found: error
          retention-days: 7

      - name: Upload Failsafe Reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: failsafe-reports
          path: target/failsafe-reports/
          retention-days: 7

      # Upload the IT .exec binary for the coverage merge step
      - name: Upload Integration Test Coverage Data
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: jacoco-it-exec
          path: target/jacoco-it.exec
          retention-days: 1

      # Dump Docker state and Fineract container logs on failure for diagnostics
      - name: Dump Docker state and Fineract logs on failure
        if: failure()
        run: |
          echo "=== docker info ==="
          docker info || true
          echo "=== docker ps -a ==="
          docker ps -a || true
          echo "=== Docker logs for apache/fineract containers ==="
          for id in $(docker ps -a -q --filter "ancestor=$FINERACT_IT_IMAGE"); do
            echo "=== logs for container $id ==="
            docker logs "$id" || true
          done
        continue-on-error: true

  # ── Job 3: Coverage Gate — merges both .exec files before enforcing ───────
  coverage-gate:
    name: Coverage Gate
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up JDK 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          java-version: "25"
          distribution: "zulu"
          cache: "maven"

      # Download both .exec files produced in the previous two jobs
      - name: Download Unit Test Coverage Data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: jacoco-unit-exec
          path: target/

      - name: Download Integration Test Coverage Data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: jacoco-it-exec
          path: target/

      # Compile is required so JaCoCo can map bytecode back to source lines
      - name: Compile (no tests)
        run: ./mvnw -B compile -Dspotless.check.skip=true --file pom.xml

      # jacoco:merge reads all *.exec in target/, writes target/jacoco-merged.exec
      # jacoco:report generates the human-readable HTML from the merged data
      # jacoco:check enforces the ratchet thresholds (see pom.xml enforce-coverage execution)
      - name: Merge Coverage Data and Enforce Thresholds
        run: |
          ./mvnw -B jacoco:merge@merge-results jacoco:report@report-merged jacoco:check@enforce-coverage \
            -Djacoco.dataFile=target/jacoco-merged.exec \
            -Dspotless.check.skip=true \
            --file pom.xml

      - name: Upload Merged Coverage Report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: jacoco-merged-report
          path: target/site/jacoco-merged/
          retention-days: 14

  deploy-jar:
    name: Upload Plugin JAR to Server
    needs: [integration-tests, coverage-gate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: selfservice-plugin-scp-develop
      cancel-in-progress: false
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ vars.SSH_PORT || '22' }}
      JAR_DEPLOY_PATH: ${{ secrets.JAR_DEPLOY_PATH || '/opt/fineract/plugins/libs'}}
    steps:
      - name: Download Tested Plugin JAR
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: selfservice-plugin-jar
          path: deployment/

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Configure SSH
        shell: bash
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for setting in SSH_HOST SSH_USER SSH_PORT JAR_DEPLOY_PATH SSH_KNOWN_HOSTS; do
            if [ -z "${!setting}" ]; then
              echo "Missing deployment setting: $setting" >&2
              exit 1
            fi
          done
          # Restrict values interpolated into SSH destinations and remote commands.
          [[ "$SSH_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$SSH_USER" =~ ^[a-zA-Z_][a-zA-Z0-9_-]*$ ]]
          [[ "$SSH_PORT" =~ ^[0-9]+$ ]]
          [[ "$JAR_DEPLOY_PATH" =~ ^/[a-zA-Z0-9_./-]+$ ]]
          install -m 700 -d "$RUNNER_TEMP/plugin-ssh"
          umask 077
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/plugin-ssh/known_hosts"

      - name: Upload JAR via SCP
        shell: bash
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$SSHPASS" ]; then
            echo "Missing deployment setting: SSH_PASSWORD" >&2
            exit 1
          fi
          options=(-o "UserKnownHostsFile=$RUNNER_TEMP/plugin-ssh/known_hosts"
            -o StrictHostKeyChecking=yes -o ConnectTimeout=30
            -o PreferredAuthentications=password -o PubkeyAuthentication=no
            -o NumberOfPasswordPrompts=1)
          sshpass -e ssh "${options[@]}" -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "mkdir -p -- '$JAR_DEPLOY_PATH'"
          sshpass -e scp "${options[@]}" -P "$SSH_PORT" deployment/*.jar "$SSH_USER@$SSH_HOST:$JAR_DEPLOY_PATH/"

      - name: Remove SSH Credentials
        if: always()
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/plugin-ssh"
